version: '3.5'

services:
  rpg_bot_db:
    container_name: rpg_bot_cont
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=rpg_bot
    image: postgres:14.3-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data  
volumes:
  postgres_data: